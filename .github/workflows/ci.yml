name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test the contact function
        run: npm test
      - name: Build (fails on any [[ADD]] placeholder or missing social card)
        # SITE_URL makes the build emit absolute canonical, og:image and sitemap URLs, so the
        # checks can see them. The real value lives in Vercel; this one only has to be a URL.
        env:
          SITE_URL: https://asgatcreation.vercel.app
        run: npm run build
